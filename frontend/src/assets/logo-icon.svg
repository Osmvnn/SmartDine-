    <rect x="134" y="182" width="8" height="8"/>
    <rect x="146" y="182" width="8" height="8"/>
    <rect x="134" y="194" width="8" height="8"/>
    <rect x="150" y="196" width="8" height="8"/>
    <rect x="112" y="182" width="8" height="8"/>
    <rect x="112" y="206" width="8" height="8"/>
